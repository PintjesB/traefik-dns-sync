name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "sync.py"
      - ".dockerignore"
      - "tests/**"
      - ".github/workflows/docker.yml"
      - ".github/workflows/auto-tag.yml"
  pull_request:
    branches:
      - main

concurrency:
  group: docker-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  test:
    name: Unit tests + Redis integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate Python runtime alignment
        shell: bash
        run: |
          set -euo pipefail
          ci_line="$(python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          image_line="$(sed -n 's/^FROM python:\([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' Dockerfile)"
          test -n "$image_line"
          if [[ "$ci_line" != "$image_line" ]]; then
            echo "::error::Python interpreter lines must move together: CI=$ci_line image=$image_line"
            exit 1
          fi

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run isolated unit tests
        run: python -m unittest discover -s tests -p 'test_sync.py' -v

      - name: Run live Redis integration
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_INTEGRATION: "1"
          CF_API_TOKEN: test-token
          CF_ZONE_NAME: example.com
          CNAME_TARGET: edge.example.net
          EXCLUDE_HOSTS: skip.example.com
        run: python -m unittest discover -s tests -p 'test_redis_integration.py' -v

  build:
    name: Validate image build
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Validate multi-platform image build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          tags: traefik-dns-sync:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min
          platforms: linux/amd64,linux/arm64

      - name: Build native image for scan and smoke tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: traefik-dns-sync:ci
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=min
          platforms: linux/amd64

      - name: Scan built image for HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: traefik-dns-sync:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke test application in the built image
        run: >-
          docker run --rm --entrypoint python
          --volume "${{ github.workspace }}/tests:/tests:ro"
          traefik-dns-sync:ci -m unittest discover -s /tests -v

  publish:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          platforms: linux/amd64,linux/arm64
