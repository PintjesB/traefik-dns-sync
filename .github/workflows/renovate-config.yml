name: Validate Renovate configuration

on:
  pull_request:
    paths:
      - "renovate.json"
      - ".github/workflows/renovate-config.yml"
  push:
    branches:
      - main
    paths:
      - "renovate.json"
      - ".github/workflows/renovate-config.yml"

concurrency:
  group: renovate-config-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Renovate configuration
        run: npx --yes --package renovate -- renovate-config-validator --strict
